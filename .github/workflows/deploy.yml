name: Auto Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - forNestEliteFund

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest # ไม่ต้อง self-hosted แล้ว เพราะใช้ SSH เข้า VPS

    steps:
      # =====================
      # 📥 Checkout
      # =====================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================
      # ✅ Merge Elite-Fund-web -> build
      # =====================
      - name: Merge branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin

          git checkout build || git checkout -b build
          git reset --hard origin/build || true

          git merge origin/forNestEliteFund --no-edit
          git push origin build

      # =====================
      # 🚀 Deploy to VPS (SSH)
      # =====================
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/EliteFoundWeb

            git fetch origin
            git reset --hard origin/build

            docker compose down --remove-orphans
            docker compose up -d --build

            docker image prune -f
