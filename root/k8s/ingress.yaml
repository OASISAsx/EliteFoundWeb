apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.event-seat.elitefund.fun
        - nanthawat.elitefund.fun # <--- เพิ่มโดเมนใหม่ที่นี่เพื่อให้ใช้ SSL ได้
      secretName: event-seat-tls # ใช้ Secret เดิม (ถ้าใบเซอร์ครอบคลุมทั้งคู่)
  rules:
    - host: api.event-seat.elitefund.fun
      http:
        paths:
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
    # --- เพิ่ม Rule สำหรับ Portfolio ---
    - host: nanthawat.elitefund.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-service
                port:
                  number: 8100 # พอร์ตที่ Docker Compose เปิดไว้
