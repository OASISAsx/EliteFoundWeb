services:
  # 1. Service ของ Next.js (Portfolio)
  web:
    container_name: portfolio_web
    build: .
    restart: always
    ports:
      - "8100:3000"
    environment:
      NODE_ENV: production

  # 2. Service ของ Nginx Proxy
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    network_mode: "host" # เชื่อมต่อกับ localhost:8100 ของเครื่องได้ทันที
    volumes:
      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - /etc/nginx/sites-available:/etc/nginx/sites-available:ro # เพิ่มอันนี้เพื่อให้ Symlink ทำงานได้
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www:/var/www:ro
